<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello World!</h1>
    <div id="content">
    
    </div>
    <script>
        let contentIput = document.getElementById('content');

        contentIput.innerHTML = `Hi from Js`

       let innerDiv = document.createElement('div');
       innerDiv.innerHTML = `This is inner Div added through Js`
       contentIput.appendChild(innerDiv);

       innerDiv.setAttribute('id', 'sub-content');
    </script>
</body>
</html>
