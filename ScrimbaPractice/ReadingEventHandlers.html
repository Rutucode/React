<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reading Event Handlers</title>
  </head>
  <body>
    <script>
      /*
        React lets you add event handlers to your JSX. 
        Event handlers are your own functions that will be triggered in response to 
        interactions like clicking, hovering, focusing form inputs, and so on.
        */
      export default function Button() {
        function handleClick() {
          alert("You clicked me!");
        }

        return <button onClick={handleClick}>Click me</button>;
      }

      /*
          //   Other way
        <button onClick={function handleClick() {
        alert('You clicked me!');
        }}>

        //Arrow function
        <button onClick={() => {
        alert('You clicked me!');
        }}>
        */
    </script>
  </body>
</html>
