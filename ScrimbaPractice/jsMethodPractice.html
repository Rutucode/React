<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // return an array of each number, squared
        const nums = [1,2,3,4,5]
        const square = nums.map(x => x * 2);
        console.log(square)

        // return an array where the first letter of each string is capitalized
        const names = ["alice", "bob", "charlie", "danielle"]

        const capitalized = names.map((string) => string.charAt(0).toUpperCase() + string.slice(1))
        console.log(capitalized)
        // map() iterates over each element
        // charAt(0).toUpperCase() uppercases the first character
        // slice(1) appends the rest of the string unchanged

        // forEach()

        const arr = ['apple', 'banana', 'cherry']
        arr.forEach((string, i) => {
            arr[i] = string.charAt(0).toUpperCase()+ string.slice(1)
        })
        console.log(arr)
        // forEach() lets you reassign each element directly

        /*Prototype or Reusable Function
            To keep things DRY and reusable:*/
            function capitalize(s){
                return s.charAt(0).toUpperCase()+ s.slice(1);
            }
            const array = ['apple', 'banana'];
            const capitalizedArray = array.map(capitalize)

        //  extend String prototype:
        String.prototype.capitalize = function() {
        return this.charAt(0).toUpperCase() + this.slice(1);
        };
        const capitalizedString = ['apple','banana'].map(s => s.capitalize());


        /*Given an array of strings, return an array of strings that wraps each
        of the original strings in an HTML-like <p></p> tag.

        E.g. given: ["Bulbasaur", "Charmander", "Squirtle"]
        return: ["<p>Bulbasaur</p>", "<p>Charmander</p>", "<p>Squirtle</p>"]
        */

        const pokemon = ["Bulbasaur", "Charmander", "Squirtle"]
        // -->          ["<p>Bulbasaur</p>", "<p>Charmander</p>", "<p>Squirtle</p>"]
        // code here
        const pokeWrap = pokemon.map((names) => `<p>${names}</p>`)
        console.log(pokeWrap)
    </script>
</body>
</html>
